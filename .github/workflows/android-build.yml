name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Prepare debug signing key
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=UtsavSetu CI Debug,O=Development,C=IN"
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM and Robolectric tests
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK and App Bundle
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:bundleDebug

      - name: Stage debug distributables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/debug
          cp app/build/outputs/apk/debug/app-debug.apk dist/debug/UtsavSetu-debug.apk
          cp app/build/outputs/bundle/debug/app-debug.aab dist/debug/UtsavSetu-debug.aab
          (cd dist/debug && sha256sum UtsavSetu-debug.apk UtsavSetu-debug.aab > SHA256SUMS.txt)

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtsavSetu-debug-APK
          path: dist/debug/UtsavSetu-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtsavSetu-debug-AAB
          path: dist/debug/UtsavSetu-debug.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug checksums
        uses: actions/upload-artifact@v4
        with:
          name: UtsavSetu-debug-SHA256
          path: dist/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Prepare production signing keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/my-upload-key.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build production-signed APK and App Bundle
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Stage production release files
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp app/build/outputs/apk/release/app-release.apk dist/release/UtsavSetu-release.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/release/UtsavSetu-release.aab
          (cd dist/release && sha256sum UtsavSetu-release.apk UtsavSetu-release.aab > SHA256SUMS.txt)

      - name: Upload production APK artifact
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: UtsavSetu-release-APK
          path: dist/release/UtsavSetu-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload production AAB artifact
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: UtsavSetu-release-AAB
          path: dist/release/UtsavSetu-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish production-signed GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          name: UtsavSetu ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/UtsavSetu-release.apk
            dist/release/UtsavSetu-release.aab
            dist/release/SHA256SUMS.txt
          body: |
            Production-signed UtsavSetu Android release for ${{ github.ref_name }}.

            APK is provided for direct installation/testing. AAB is the Play Console upload package.
            Verify SHA256SUMS.txt before distribution.

      - name: Explain skipped production release
        if: startsWith(github.ref, 'refs/tags/v') && (env.KEYSTORE_BASE64 == '' || env.STORE_PASSWORD == '' || env.KEY_PASSWORD == '')
        run: |
          echo "::warning::Production release was not published because one or more signing secrets are missing."
          echo "Configure KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD in repository Actions secrets, then rerun the tag workflow."
